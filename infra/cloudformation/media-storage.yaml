AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  MediaWiki storage: private media S3 bucket and the IAM policy for the wiki
  instance role (Extension:AWS), plus the nightly-backup bucket. Media is served
  via the CloudFront stack in media-cdn.yaml.

# Deploy in the wiki's region (us-east-2):
#   aws cloudformation deploy --region us-east-2 --stack-name wiki-media-storage \
#     --template-file infra/cloudformation/media-storage.yaml \
#     --capabilities CAPABILITY_IAM \
#     --parameter-overrides InstanceRoleName=<wiki-ec2-role>
# Then deploy media-cdn.yaml (us-east-1) with the BucketRegionalDomainName
# output, and re-run this stack with DistributionId=<DistributionId output> to
# restrict bucket reads to that distribution.
#
# The backup bucket already exists, so it must be IMPORTED into the stack; a
# normal deploy fails with "already exists". An import change set cannot modify
# other resources or outputs, so the IAM statements that depend on it are
# switched off with BackupAccess=false for that one step (in the console, set
# BackupAccess to false on the parameters page):
#   aws cloudformation create-change-set --region us-east-2 --stack-name wiki-media-storage \
#     --change-set-name import-backups --change-set-type IMPORT \
#     --resources-to-import '[{"ResourceType":"AWS::S3::Bucket","LogicalResourceId":"BackupBucket","ResourceIdentifier":{"BucketName":"asmbly-wiki-backups-110104886034-us-east-2-an"}}]' \
#     --template-body file://infra/cloudformation/media-storage.yaml \
#     --capabilities CAPABILITY_IAM \
#     --parameters ParameterKey=BackupAccess,ParameterValue=false \
#                  ParameterKey=InstanceRoleName,UsePreviousValue=true \
#                  ParameterKey=DistributionId,UsePreviousValue=true
#   aws cloudformation execute-change-set --region us-east-2 --stack-name wiki-media-storage \
#     --change-set-name import-backups
# Then run the normal deploy above (BackupAccess defaults to true) to apply the
# bucket's lifecycle rules/tags and add the IAM permissions. Importing alone
# changes nothing on the bucket.
#
# LocalSettings.php (after installing Extension:AWS and syncing images/):
#   wfLoadExtension( 'AWS' );
#   $wgAWSRegion = 'us-east-2';
#   $wgAWSBucketName = 'asmbly-media';       # = BucketName
#   $wgAWSBucketTopSubdirectory = '/wiki';   # = MediaPrefix; URLs become cdn.asmbly.org/wiki/...
#   $wgAWSBucketDomain = 'cdn.asmbly.org';
#   $wgAWSRepoHashLevels = '2';
#   $wgAWSRepoDeletedHashLevels = '3';
#   $wgFileBackends['s3']['privateWiki'] = true;  # upload with ACL private
#
# One bucket and CDN hostname are shared by several sites, each under its own
# prefix: wiki/ (read-write from the wiki instance) and classes/ (the wiki
# instance has no access to it). Writers to classes/ (CI, staff, thumbnailer)
# are granted by the classes-media stack in the asmbly-classes repo, which
# consumes this bucket's EventBridge events. Staff-uploaded originals under
# classes/images/src/ are not served; only the generated variants are.
# Seed existing files with:
#   aws s3 sync images/ s3://asmbly-media/wiki/ --exclude 'thumb/*' --exclude 'temp/*'
#
# Objects are private and only readable via CloudFront. Extension:AWS normally
# uploads with ACL public-read; privateWiki makes it send ACL private, so public
# ACLs can be blocked outright. The extension marks its deleted/ and temp/ zones
# private with ACLs alone, which CloudFront ignores, so the bucket policy denies
# them. Versioning is the recovery path for deleted/overwritten files, replacing
# the images/ tarball in the nightly backup.

Parameters:
  BucketName:
    Type: String
    Default: asmbly-media
    Description: Globally unique bucket name. Hard-coded in config/mediawiki/LocalSettings.php ($wgAWSBucketName).
  MediaPrefix:
    Type: String
    Default: wiki
    AllowedPattern: ^[a-z0-9][a-z0-9-]*$
    Description: Key prefix for the wiki's files (no slashes). Must match $wgAWSBucketTopSubdirectory.
  ClassesPrefix:
    Type: String
    Default: classes
    AllowedPattern: ^[a-z0-9][a-z0-9-]*$
    Description: Key prefix for the Classes site's files. Served by CloudFront; write access is granted by the classes-media stack.
  DistributionId:
    Type: String
    Default: "*"
    Description: CloudFront distribution ID allowed to read the bucket. "*" allows any distribution in this account (use for the first deploy only).
  InstanceRoleName:
    Type: String
    Default: ""
    Description: Existing IAM role of the wiki EC2 instance to attach the upload policy to. Leave empty to attach manually.
  BackupBucketName:
    Type: String
    Default: asmbly-wiki-backups-110104886034-us-east-2-an
    Description: Name of the existing MediaWiki backup bucket (BACKUP_BUCKET in the backup sysconfig). Must already exist; imported, not created.
  BackupAccess:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Grant the wiki instance backup-bucket access. Set to "false" only for the one-time bucket import change set.
  NoncurrentVersionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Days to keep overwritten or deleted file versions.

Rules:
  MustBeUsEast2:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-2]
        AssertDescription: Deploy in us-east-2 ($wgAWSRegion in LocalSettings.php).

Conditions:
  GrantBackupAccess: !Equals [!Ref BackupAccess, "true"]
  AttachToRole: !Not [!Equals [!Ref InstanceRoleName, ""]]

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      Tags:
        - { Key: Project, Value: mediawiki-ami }
        - { Key: Component, Value: media }
        - { Key: Environment, Value: prod }
        - { Key: Owner, Value: it-volunteers }
        - { Key: Workspace, Value: org-wide }
        - { Key: ManagedBy, Value: cloudformation }
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      # Drives the classes image thumbnailer (classes-media stack).
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref NoncurrentVersionDays
            ExpiredObjectDeleteMarker: true
          # Thumbnails are regenerated on purge/re-upload; old versions have no value.
          - Id: expire-old-thumb-versions
            Status: Enabled
            Prefix: !Sub ${MediaPrefix}/thumb/
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BackupBucketName
      Tags:
        - { Key: Project, Value: mediawiki-ami }
        - { Key: Component, Value: backups }
        - { Key: Environment, Value: prod }
        - { Key: Owner, Value: it-volunteers }
        - { Key: Workspace, Value: org-wide }
        - { Key: ManagedBy, Value: cloudformation }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: mediawiki-daily-expire
            Status: Enabled
            Prefix: backups/daily/
            ExpirationInDays: 5
          - Id: mediawiki-weekly-tier
            Status: Enabled
            Prefix: backups/weekly/
            Transitions:
              - { TransitionInDays: 30, StorageClass: STANDARD_IA }
            ExpirationInDays: 57
          - Id: mediawiki-monthly-tier
            Status: Enabled
            Prefix: backups/monthly/
            Transitions:
              - { TransitionInDays: 30, StorageClass: STANDARD_IA }
              - { TransitionInDays: 90, StorageClass: GLACIER_IR }
            ExpirationInDays: 366
          - Id: mediawiki-abort-incomplete-multipart
            Status: Enabled
            Prefix: backups/
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3
          - Id: mediawiki-expire-noncurrent-versions
            Status: Enabled
            Prefix: backups/
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource:
              - !Sub ${MediaBucket.Arn}/${MediaPrefix}/*
              - !Sub ${MediaBucket.Arn}/${ClassesPrefix}/*
            Condition:
              StringLike:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}
          - Sid: CloudFrontDenyPrivateZones
            Effect: Deny
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource:
              - !Sub ${MediaBucket.Arn}/${MediaPrefix}/deleted/*
              - !Sub ${MediaBucket.Arn}/${MediaPrefix}/temp/*
              - !Sub ${MediaBucket.Arn}/${ClassesPrefix}/images/src/*
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub ${MediaBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  UploadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Lets the wiki instance read/write its media bucket (Extension:AWS).
      Roles: !If [AttachToRole, [!Ref InstanceRoleName], !Ref "AWS::NoValue"]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ObjectReadWrite
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:PutObjectAcl
              - s3:DeleteObject
              - s3:AbortMultipartUpload
            Resource: !Sub ${MediaBucket.Arn}/${MediaPrefix}/*
          - Sid: BucketList
            Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt MediaBucket.Arn
            Condition:
              StringLike:
                s3:prefix: [!Sub "${MediaPrefix}/*", !Ref MediaPrefix]
          - Sid: BucketMeta
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:ListBucketMultipartUploads
            Resource: !GetAtt MediaBucket.Arn
          - !If
            - GrantBackupAccess
            - Sid: BackupReadWrite
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub ${BackupBucket.Arn}/backups/*
            - !Ref AWS::NoValue
          - !If
            - GrantBackupAccess
            - Sid: BackupList
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt BackupBucket.Arn
            - !Ref AWS::NoValue

Outputs:
  BucketName:
    Description: Value for $wgAWSBucketName
    Value: !Ref MediaBucket
  BucketRegionalDomainName:
    Description: Origin for media-cdn.yaml
    Value: !GetAtt MediaBucket.RegionalDomainName
  UploadPolicyArn:
    Description: Attach to the wiki instance role if InstanceRoleName was left empty
    Value: !Ref UploadPolicy
