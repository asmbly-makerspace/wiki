AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  MediaWiki uploads, delivery half: CloudFront (OAC to the S3 bucket from
  media-storage.yaml), CloudFront-scope WAF rate limits, and the Free flat-rate plan.

# CloudFront-scope WAF and its ACM certificate only exist in us-east-1, so this
# stack must be deployed there; the bucket stays in the wiki's region (us-east-2).
#   1. Deploy media-storage.yaml in us-east-2 first.
#   2. Request an ACM certificate for cdn.asmbly.org in us-east-1 and add its
#      DNS validation CNAME.
#   3. aws cloudformation deploy --region us-east-1 --stack-name wiki-media-cdn \
#        --template-file infra/cloudformation/media-cdn.yaml \
#        --parameter-overrides CertificateArn=<arn> \
#          BucketRegionalDomainName=<media-storage output>
#   4. Create the DNS CNAME cdn.asmbly.org -> DistributionDomain output.
#   5. Re-deploy media-storage.yaml with DistributionId=<DistributionId output>.
#
# Billing: the distribution is subscribed to the CloudFront FREE flat-rate plan
# ($0, WAF ACL included, no overage charges). Its allowances are 1M requests and
# 100 GB per month; they are guidance, not hard limits, and AWS emails at 50/80/100%.
# The Free plan only permits AWS-managed cache/response-header policies and at
# most 5 WAF rules, which is why those are used below. Upgrade the tier outside
# CloudFormation (see the PricingPlanManager docs), then update this template.

Parameters:
  CustomDomainName:
    Type: String
    Default: cdn.asmbly.org
    Description: Media hostname. Create the CNAME to the DistributionDomain output manually.
  CertificateArn:
    Type: String
    AllowedPattern: ^arn:aws[a-zA-Z-]*:acm:us-east-1:\d{12}:certificate/.+$
    Description: ACM certificate ARN (us-east-1) covering CustomDomainName.
  BucketRegionalDomainName:
    Type: String
    AllowedPattern: ^[a-z0-9.-]+\.s3\.[a-z0-9-]+\.amazonaws\.com$
    Description: BucketRegionalDomainName output of the media-storage stack.
  RateLimitAll:
    Type: Number
    Default: 1000
    MinValue: 10
    Description: Max requests per IP per 5 minutes for any file.
  RateLimitPdf:
    Type: Number
    Default: 20
    MinValue: 10
    Description: Max PDF requests per IP per 5 minutes.

Rules:
  MustBeUsEast1:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: Deploy in us-east-1 (CloudFront-scope WAF requirement).

Resources:
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-media
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub ${AWS::StackName}-media
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        SampledRequestsEnabled: true
        MetricName: !Sub ${AWS::StackName}-media
      Rules:
        - Name: rate-limit-pdf
          Priority: 0
          Action:
            Block: {}
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            SampledRequestsEnabled: true
            MetricName: !Sub ${AWS::StackName}-rate-limit-pdf
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPdf
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: .pdf
                  PositionalConstraint: ENDS_WITH
                  FieldToMatch:
                    UriPath: {}
                  TextTransformations:
                    - Priority: 0
                      Type: LOWERCASE
        - Name: rate-limit-all
          Priority: 1
          Action:
            Block: {}
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            SampledRequestsEnabled: true
            MetricName: !Sub ${AWS::StackName}-rate-limit-all
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitAll
              EvaluationWindowSec: 300
              AggregateKeyType: IP

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} wiki media
        HttpVersion: http2and3
        IPV6Enabled: true
        WebACLId: !GetAtt WebAcl.Arn
        Aliases: [!Ref CustomDomainName]
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: media-bucket
            DomainName: !Ref BucketRegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: media-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS-managed: CachingOptimized and SimpleCORS (Free plan allows only managed policies)
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 60669652-455b-4ae9-85a4-c4c02393f86c

  PricingPlan:
    Type: AWS::PricingPlanManager::Subscription
    Properties:
      PlanFamily: CloudFront
      PlanTier: FREE
      UsageLevel: DEFAULT
      ResourceArns:
        - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
        - !GetAtt WebAcl.Arn

Outputs:
  DistributionId:
    Description: Pass to media-storage.yaml as DistributionId
    Value: !Ref Distribution
  DistributionDomain:
    Description: CNAME target for CustomDomainName
    Value: !GetAtt Distribution.DomainName
